[project]
name = "renati-scraping"
version = "0.1.0"
description = "Scraper interactivo para mapear tesis RENATI y exportar resultados a Excel."
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "requests>=2.31",
    "selenium>=4.18",
    "undetected-chromedriver>=3.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
